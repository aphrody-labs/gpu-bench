[package]
name = "gpu-bench-bevy"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "gpu-bench-bevy"
path = "src/main.rs"

[features]
# Native keeps the default Windows platform stack; the web build selects the WebGPU backend only (no WebGL2 fallback).
native = ["bevy/multi_threaded"]
web = ["bevy/webgpu"]

[dependencies]
bevy = { path = "../../vendor/bevy", default-features = false, features = ["std", "async_executor", "default_app", "bevy_winit", "3d_bevy_render", "jpeg", "render_dev_tools"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.2"
wasm-bindgen = "=0.2.130"
web-sys = { version = "0.3", features = ["Window", "Performance", "Location"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
